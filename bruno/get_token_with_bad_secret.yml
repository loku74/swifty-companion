info:
  name: Get token with bad secret
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/oauth/token"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: client_credentials
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: not-the-real-secret

runtime:
  scripts:
    - type: tests
      code: |-
        // token.ts treats both 400 and 401 as "credentials rejected".
        test("rejects the credentials with 400 or 401", function () {
          expect(res.getStatus()).to.be.oneOf([400, 401]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
