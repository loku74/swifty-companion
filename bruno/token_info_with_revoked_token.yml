info:
  name: Token info with revoked token
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/oauth/token/info"
  auth:
    type: bearer
    token: revoked-token

runtime:
  scripts:
    - type: tests
      code: |-
        // client.ts renews the token and retries once when it gets a 401.
        test("rejects the token with 401", function () {
          expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
